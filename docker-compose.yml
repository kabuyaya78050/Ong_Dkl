services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ong-dkl:local
    container_name: ong-dkl-app
    restart: unless-stopped
    ports:
      - "8000:10000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: laravel
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: public
      PORT: 10000
    depends_on:
      - db
    volumes:
      - .:/var/www:cached

  db:
    image: postgres:16-alpine
    container_name: ong-dkl-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: laravel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
